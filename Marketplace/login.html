<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Woz Marketplace</title>
  <link rel="stylesheet" href="registro.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
</head>
<body>
  <main class="auth">
    <header class="auth__header">
      <a href="index.html" class="brand" aria-label="Volver al inicio">Woz <span>Marketplace</span></a>
      <h1 class="auth__title">Inicia sesión</h1>
      <p class="auth__subtitle">Accede a tu cuenta</p>
    </header>

    <section class="auth__form">
      <form id="login-form" action="#" method="post">
        <div class="form-row">
          <label for="documento_login">Número de documento</label>
          <input type="text" id="documento_login" name="documento_login" required placeholder="Tu documento" autocomplete="off">
        </div>
        <div class="form-row">
          <label for="contrasena_login">Contraseña</label>
          <input type="password" id="contrasena_login" name="contrasena_login" required placeholder="" autocomplete="current-password">
        </div>
        <div class="form-row checkbox-row">
          <label class="checkbox">
            <input type="checkbox" name="recuerdame" value="si">
            <span>Recuérdame</span>
          </label>
        </div>
        <button type="submit" class="btn-primary">Ingresar</button>
        <p class="muted center"><a href="#">¿Olvidaste tu contraseña?</a></p>
      </form>
    </section>

    <footer class="auth__footer">
      <p>¿No tienes cuenta? <a href="registro.html">Crea una cuenta</a></p>
      <small>© Woz Marketplace</small>
    </footer>
  </main>
  <script src="js/regsitro.js"></script>
</body>
</html>
